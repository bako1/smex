<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Content Manager</title>

    <!-- Load Decap CMS from CDN -->
    <script src="https://unpkg.com/decap-cms@latest/dist/decap-cms.js"></script>

  </head>
  <body>
    <!-- Manual initialization before the CMS script -->
    <script>
      window.CMS_MANUAL_INIT = true;

      // Ensure Decap CMS initializes after the DOM content is fully loaded
      document.addEventListener('DOMContentLoaded', function() {
        // Initialize Decap CMS in the div with id 'decap-cms'
        CMS.init({
          el: document.getElementById('decap-cms'),
          config: {
            backend: {
              name: 'github',
              repo: 'papy/smex', // Replace with your GitHub repository name
              branch: 'main',    // Set the branch (usually 'main' or 'master')
              // Optionally add other backend configuration here (e.g., authentication)
            },
            media_folder: 'static/media', // Customize media folder if needed
            public_folder: '/static/media', // Path to public folder
            collections: [
              {
                name: 'posts', // Collection name
                label: 'Posts', // Label for collection in UI
                folder: 'content/posts', // Folder in your GitHub repository
                create: true, // Allow content creation
                fields: [
                  {
                    label: 'Title',
                    name: 'title',
                    widget: 'string',
                  },
                  {
                    label: 'Body',
                    name: 'body',
                    widget: 'markdown',
                  }
                ]
              }
            ]
          }
        });
      });
    </script>

    <!-- CMS Container -->
    <div id="decap-cms"></div>

  </body>
</html>
